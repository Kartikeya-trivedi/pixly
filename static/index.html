<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Overlay AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: #ffffff;
            overflow: hidden;
        }

        .overlay-container {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 380px;
            max-height: 85vh;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 16px;
            border: 2px solid #00ff88;
            backdrop-filter: blur(15px);
            box-shadow: 0 12px 40px rgba(0, 255, 136, 0.4);
            z-index: 9999;
            transition: all 0.3s ease;
            cursor: move;
        }

        .overlay-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 50px rgba(0, 255, 136, 0.5);
        }

        .overlay-header {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            padding: 14px 18px;
            border-radius: 14px 14px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            user-select: none;
        }

        .overlay-title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff00;
            animation: pulse 2s infinite;
        }

        .overlay-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            background: rgba(0, 0, 0, 0.2);
            border: none;
            color: #000;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
            margin-left: 4px;
        }

        .control-btn:hover {
            background: rgba(0, 0, 0, 0.4);
            transform: scale(1.1);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .overlay-content {
            padding: 20px;
            max-height: calc(85vh - 70px);
            overflow-y: auto;
        }

        .overlay-content::-webkit-scrollbar {
            width: 6px;
        }

        .overlay-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .overlay-content::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 3px;
        }

        .overlay-content::-webkit-scrollbar-thumb:hover {
            background: #00cc6a;
        }

        .tip-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid #00ff88;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .tip-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.1), transparent);
            transition: left 0.5s;
        }

        .tip-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(4px) translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
        }

        .tip-card:hover::before {
            left: 100%;
        }

        .tip-card:active {
            transform: translateX(2px) translateY(-1px);
        }

        .tip-title {
            font-size: 16px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tip-content {
            font-size: 14px;
            line-height: 1.5;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .tip-meta {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            font-size: 12px;
            color: #888;
            flex-wrap: wrap;
        }

        .tip-meta span {
            background: rgba(0, 255, 136, 0.2);
            padding: 4px 8px;
            border-radius: 12px;
            color: #00ff88;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #00ff88;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(0, 255, 136, 0.3);
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border-left-color: #ff0000;
            color: #ff6666;
        }

        .success {
            background: rgba(0, 255, 0, 0.2);
            border-left-color: #00ff00;
            color: #00ff00;
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .action-btn {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(0, 255, 136, 0.3);
            transform: scale(1.05);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .game-selector {
            margin-bottom: 16px;
        }

        .game-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00ff88;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .game-input:focus {
            outline: none;
            border-color: #00cc6a;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .game-input::placeholder {
            color: #888;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00ff88;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #00cc6a;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
    </style>
</head>
<body>
    <div class="overlay-container" id="overlay">
        <div class="overlay-header">
            <div class="overlay-title">
                🎮 Game Overlay AI
                <div class="status-indicator" id="statusIndicator"></div>
            </div>
            <div class="overlay-controls">
                <button class="control-btn" id="refreshBtn" title="Refresh Tips">↻</button>
                <button class="control-btn" id="minimizeBtn" title="Minimize">−</button>
                <button class="control-btn" id="closeBtn" title="Close">×</button>
            </div>
        </div>
        
        <div class="overlay-content">
            <div class="game-selector">
                <input 
                    type="text" 
                    class="game-input" 
                    id="gameInput" 
                    placeholder="Enter game name (e.g., minecraft)"
                    value="minecraft"
                >
            </div>
            
            <input 
                type="text" 
                class="search-input" 
                id="searchInput" 
                placeholder="Search for tips..."
            >
            
            <div id="tipsContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>Loading tips...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class GameOverlay {
            constructor() {
                this.apiBase = 'http://127.0.0.1:8000/api/v1';
                this.currentGame = 'minecraft';
                this.isMinimized = false;
                this.isConnected = false;
                this.tips = [];
                this.favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.setupDragAndDrop();
                this.checkConnection();
                this.loadTips();
                this.startPeriodicUpdates();
                this.setupKeyboardShortcuts();
            }

            setupEventListeners() {
                // Game input
                document.getElementById('gameInput').addEventListener('change', (e) => {
                    this.currentGame = e.target.value;
                    this.loadTips();
                });

                // Search input with debouncing
                let searchTimeout;
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        this.loadTips(e.target.value);
                    }, 300);
                });

                // Control buttons
                document.getElementById('refreshBtn').addEventListener('click', () => {
                    this.refreshTips();
                });

                document.getElementById('minimizeBtn').addEventListener('click', () => {
                    this.toggleMinimize();
                });

                document.getElementById('closeBtn').addEventListener('click', () => {
                    this.close();
                });

                // Tip card interactions
                document.addEventListener('click', (e) => {
                    if (e.target.closest('.tip-card')) {
                        this.handleTipClick(e.target.closest('.tip-card'));
                    }
                });
            }

            async loadTips(query = '') {
                const container = document.getElementById('tipsContainer');
                container.innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <div>Loading tips...</div>
                    </div>
                `;

                try {
                    const params = new URLSearchParams({
                        game: this.currentGame,
                        limit: '5'
                    });
                    
                    if (query) {
                        params.append('query', query);
                    }

                    const response = await fetch(`${this.apiBase}/tips?${params}`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const data = await response.json();
                    this.tips = data.tips;
                    this.displayTips(data.tips);
                    this.updateConnectionStatus(true);

                } catch (error) {
                    console.error('Failed to load tips:', error);
                    this.updateConnectionStatus(false);
                    container.innerHTML = `
                        <div class="tip-card error">
                            <div class="tip-title">❌ Connection Error</div>
                            <div class="tip-content">Failed to load tips: ${error.message}</div>
                            <div class="action-buttons">
                                <button class="action-btn" onclick="gameOverlay.refreshTips()">Retry</button>
                            </div>
                        </div>
                    `;
                }
            }

            displayTips(tips) {
                const container = document.getElementById('tipsContainer');
                
                if (!tips || tips.length === 0) {
                    container.innerHTML = `
                        <div class="tip-card">
                            <div class="tip-title">🔍 No Tips Found</div>
                            <div class="tip-content">Try a different search or game name.</div>
                            <div class="action-buttons">
                                <button class="action-btn" onclick="gameOverlay.loadTips()">Refresh</button>
                            </div>
                        </div>
                    `;
                    return;
                }

                const tipsHtml = tips.map((tip, index) => {
                    const isFavorite = this.favorites.includes(tip.id);
                    return `
                        <div class="tip-card fade-in" style="animation-delay: ${index * 0.1}s">
                            <div class="tip-title">
                                ${this.escapeHtml(tip.title || 'Game Tip')}
                                <span style="margin-left: auto; cursor: pointer;" onclick="gameOverlay.toggleFavorite('${tip.id}')">
                                    ${isFavorite ? '❤️' : '🤍'}
                                </span>
                            </div>
                            <div class="tip-content">${this.escapeHtml(tip.content)}</div>
                            <div class="tip-meta">
                                ${tip.category ? `<span>📂 ${tip.category}</span>` : ''}
                                ${tip.difficulty ? `<span>⚡ ${tip.difficulty}</span>` : ''}
                                ${tip.is_verified ? `<span>✅ Verified</span>` : ''}
                            </div>
                            <div class="action-buttons">
                                <button class="action-btn" onclick="gameOverlay.copyTip('${tip.id}')">📋 Copy</button>
                                <button class="action-btn" onclick="gameOverlay.shareTip('${tip.id}')">🔗 Share</button>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = tipsHtml;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            toggleMinimize() {
                this.isMinimized = !this.isMinimized;
                const overlay = document.getElementById('overlay');
                
                if (this.isMinimized) {
                    overlay.style.height = '60px';
                    overlay.querySelector('.overlay-content').style.display = 'none';
                } else {
                    overlay.style.height = 'auto';
                    overlay.querySelector('.overlay-content').style.display = 'block';
                }
            }

            close() {
                // In a real Electron app, this would close the window
                console.log('Closing overlay...');
                document.body.innerHTML = '<div style="color: white; text-align: center; padding: 20px;">Overlay closed</div>';
            }

            startPeriodicUpdates() {
                // Update tips every 30 seconds
                setInterval(() => {
                    if (!this.isMinimized) {
                        this.loadTips();
                    }
                }, 30000);
            }

            // New interactive methods
            async checkConnection() {
                try {
                    const response = await fetch(`${this.apiBase}/health`);
                    this.updateConnectionStatus(response.ok);
                } catch (error) {
                    this.updateConnectionStatus(false);
                }
            }

            updateConnectionStatus(connected) {
                this.isConnected = connected;
                const indicator = document.getElementById('statusIndicator');
                if (indicator) {
                    indicator.style.background = connected ? '#00ff00' : '#ff0000';
                }
            }

            setupDragAndDrop() {
                const overlay = document.getElementById('overlay');
                let isDragging = false;
                let startX, startY, startLeft, startTop;

                overlay.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.overlay-header')) {
                        isDragging = true;
                        startX = e.clientX;
                        startY = e.clientY;
                        startLeft = overlay.offsetLeft;
                        startTop = overlay.offsetTop;
                        overlay.style.cursor = 'grabbing';
                    }
                });

                document.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        const deltaX = e.clientX - startX;
                        const deltaY = e.clientY - startY;
                        overlay.style.left = (startLeft + deltaX) + 'px';
                        overlay.style.top = (startTop + deltaY) + 'px';
                        overlay.style.right = 'auto';
                    }
                });

                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        overlay.style.cursor = 'move';
                    }
                });
            }

            setupKeyboardShortcuts() {
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch (e.key) {
                            case 'r':
                                e.preventDefault();
                                this.refreshTips();
                                break;
                            case 'f':
                                e.preventDefault();
                                document.getElementById('searchInput').focus();
                                break;
                        }
                    }
                });
            }

            refreshTips() {
                this.loadTips(document.getElementById('searchInput').value);
            }

            toggleFavorite(tipId) {
                const index = this.favorites.indexOf(tipId);
                if (index > -1) {
                    this.favorites.splice(index, 1);
                } else {
                    this.favorites.push(tipId);
                }
                localStorage.setItem('favorites', JSON.stringify(this.favorites));
                this.displayTips(this.tips);
            }

            copyTip(tipId) {
                const tip = this.tips.find(t => t.id == tipId);
                if (tip) {
                    navigator.clipboard.writeText(`${tip.title}\n\n${tip.content}`);
                    this.showNotification('Tip copied to clipboard!');
                }
            }

            shareTip(tipId) {
                const tip = this.tips.find(t => t.id == tipId);
                if (tip && navigator.share) {
                    navigator.share({
                        title: tip.title,
                        text: tip.content,
                        url: window.location.href
                    });
                } else {
                    this.copyTip(tipId);
                    this.showNotification('Tip copied to clipboard!');
                }
            }

            handleTipClick(tipCard) {
                tipCard.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    tipCard.style.transform = '';
                }, 150);
            }

            showNotification(message) {
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: rgba(0, 255, 136, 0.9);
                    color: #000;
                    padding: 12px 20px;
                    border-radius: 8px;
                    font-weight: bold;
                    z-index: 10000;
                    animation: slideIn 0.3s ease-out;
                `;
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }
        }

        // Initialize overlay when page loads
        let gameOverlay;
        document.addEventListener('DOMContentLoaded', () => {
            gameOverlay = new GameOverlay();
        });
    </script>
</body>
</html>
