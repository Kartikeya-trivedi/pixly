<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixly - Gaming HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: transparent;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        /* Full screen gaming overlay background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 136, 255, 0.03) 0%, transparent 50%),
                linear-gradient(45deg, transparent 48%, rgba(255, 0, 255, 0.01) 49%, rgba(255, 0, 255, 0.01) 51%, transparent 52%);
            background-size: 200px 200px, 300px 300px, 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        /* Additional full-screen overlay for better coverage */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.02);
            pointer-events: none;
            z-index: 2;
        }

        .pixly-container {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 420px;
            max-height: 85vh;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 18px;
            backdrop-filter: blur(20px);
            border: 2px solid transparent;
            background-clip: padding-box;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 9999;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: move;
            overflow: hidden;
        }

        /* Dynamic RGB gradient border */
        .pixly-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                #00ff88, #00aaff, #aa00ff, #ff00aa, #ff8800, #88ff00, #00ff88);
            background-size: 400% 400%;
            border-radius: 20px;
            z-index: -1;
            animation: gradientShift 4s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 100% 50%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }

        /* Subtle animated glow */
        .pixly-container::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: linear-gradient(45deg, 
                rgba(0, 255, 136, 0.3), rgba(0, 170, 255, 0.3), 
                rgba(170, 0, 255, 0.3), rgba(255, 0, 170, 0.3));
            background-size: 400% 400%;
            border-radius: 22px;
            z-index: -2;
            animation: glowPulse 3s ease-in-out infinite;
            filter: blur(8px);
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.02); }
        }

        .pixly-container:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(0, 255, 136, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .pixly-header {
            background: linear-gradient(135deg, 
                rgba(0, 255, 136, 0.2), rgba(0, 170, 255, 0.2));
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pixly-title {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .controller-icon {
            font-size: 24px;
            filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.6));
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff0000;
            animation: statusPulse 2s infinite;
            box-shadow: 0 0 10px #ff0000;
        }

        @keyframes statusPulse {
            0%, 100% { 
                opacity: 1; 
                transform: scale(1);
                box-shadow: 0 0 10px #ff0000;
            }
            50% { 
                opacity: 0.6; 
                transform: scale(1.2);
                box-shadow: 0 0 20px #ff0000;
            }
        }

        .pixly-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .control-btn:hover::before {
            left: 100%;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        .refresh-btn:hover {
            transform: scale(1.1) rotate(180deg);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.5);
        }

        .minimize-btn {
            background: linear-gradient(135deg, #ffaa00, #ff8800);
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.3);
        }

        .minimize-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 170, 0, 0.5);
        }

        .close-btn {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.3);
        }

        .close-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 68, 68, 0.5);
        }

        .pixly-content {
            padding: 24px;
            max-height: calc(85vh - 80px);
            overflow-y: auto;
        }

        .pixly-content::-webkit-scrollbar {
            width: 8px;
        }

        .pixly-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .pixly-content::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #00ff88, #00aaff);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .pixly-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #00cc6a, #0088cc);
        }

        .game-selector {
            margin-bottom: 20px;
        }

        .game-input, .search-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid transparent;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .game-input:focus, .search-input:focus {
            outline: none;
            border-color: #00ff88;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .game-input::placeholder, .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .search-input {
            margin-bottom: 20px;
        }

        .tip-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .tip-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.1), transparent);
            transition: left 0.6s;
        }

        .tip-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-4px) translateX(4px);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(0, 255, 136, 0.2);
            border-color: rgba(0, 255, 136, 0.3);
        }

        .tip-card:hover::before {
            left: 100%;
        }

        .tip-card:active {
            transform: translateY(-2px) translateX(2px) scale(0.98);
        }

        .tip-title {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 700;
            color: #00ff88;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
        }

        .tip-content {
            font-size: 15px;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 400;
        }

        .tip-meta {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            font-size: 13px;
            flex-wrap: wrap;
        }

        .tip-meta span {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 170, 255, 0.2));
            padding: 6px 12px;
            border-radius: 20px;
            color: #ffffff;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .action-btn {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 170, 255, 0.2));
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(5px);
        }

        .action-btn:hover {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.3), rgba(0, 170, 255, 0.3));
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.3);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00ff88;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 136, 0.2);
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: linear-gradient(135deg, rgba(255, 68, 68, 0.2), rgba(255, 0, 0, 0.2));
            border-color: rgba(255, 68, 68, 0.4);
            color: #ff6666;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.2);
        }

        .error .tip-title {
            color: #ff6666;
            text-shadow: 0 0 8px rgba(255, 68, 68, 0.3);
        }

        .success {
            background: linear-gradient(135deg, rgba(0, 255, 0, 0.2), rgba(0, 200, 0, 0.2));
            border-color: rgba(0, 255, 0, 0.4);
            color: #00ff00;
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(20px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        .slide-in {
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from { 
                transform: translateX(100%) scale(0.9); 
                opacity: 0; 
            }
            to { 
                transform: translateX(0) scale(1); 
                opacity: 1; 
            }
        }

        /* Retry button pulse animation */
        .retry-pulse {
            animation: retryPulse 1.5s infinite;
        }

        @keyframes retryPulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 0 6px 25px rgba(0, 255, 136, 0.5);
            }
        }

        /* Notification styles */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.9), rgba(0, 170, 255, 0.9));
            color: #000;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 10000;
            animation: notificationSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0, 255, 136, 0.3);
        }

        @keyframes notificationSlide {
            from { 
                transform: translateX(-50%) translateY(-20px); 
                opacity: 0; 
            }
            to { 
                transform: translateX(-50%) translateY(0); 
                opacity: 1; 
            }
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .pixly-container {
                width: calc(100vw - 40px);
                right: 20px;
                left: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="pixly-container" id="pixlyOverlay">
        <div class="pixly-header">
            <div class="pixly-title">
                <span class="controller-icon">🎮</span>
                Pixly
                <div class="status-dot" id="statusIndicator"></div>
            </div>
            <div class="pixly-controls">
                <button class="control-btn refresh-btn" id="refreshBtn" title="Refresh Tips">↻</button>
                <button class="control-btn minimize-btn" id="minimizeBtn" title="Minimize">−</button>
                <button class="control-btn close-btn" id="closeBtn" title="Close">×</button>
            </div>
        </div>
        
        <div class="pixly-content">
            <div class="game-selector">
                <input 
                    type="text" 
                    class="game-input" 
                    id="gameInput" 
                    placeholder="Enter game name (e.g., minecraft)"
                    value="minecraft"
                >
            </div>
            
            <input 
                type="text" 
                class="search-input" 
                id="searchInput" 
                placeholder="Search for tips..."
            >
            
            <div id="tipsContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>Loading tips...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class PixlyHUD {
            constructor() {
                this.apiBase = 'http://127.0.0.1:8000/api/v1';
                this.currentGame = 'minecraft';
                this.isMinimized = false;
                this.isConnected = false;
                this.tips = [];
                this.favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.setupDragAndDrop();
                this.checkConnection();
                this.loadTips();
                this.startPeriodicUpdates();
                this.setupKeyboardShortcuts();
            }

            setupEventListeners() {
                // Game input
                document.getElementById('gameInput').addEventListener('change', (e) => {
                    this.currentGame = e.target.value;
                    this.loadTips();
                });

                // Search input with debouncing
                let searchTimeout;
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        this.loadTips(e.target.value);
                    }, 300);
                });

                // Control buttons
                document.getElementById('refreshBtn').addEventListener('click', () => {
                    this.refreshTips();
                });

                document.getElementById('minimizeBtn').addEventListener('click', () => {
                    this.toggleMinimize();
                });

                document.getElementById('closeBtn').addEventListener('click', () => {
                    this.close();
                });

                // Tip card interactions
                document.addEventListener('click', (e) => {
                    if (e.target.closest('.tip-card')) {
                        this.handleTipClick(e.target.closest('.tip-card'));
                    }
                });
            }

            async loadTips(query = '') {
                const container = document.getElementById('tipsContainer');
                container.innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <div>Loading tips...</div>
                    </div>
                `;

                try {
                    const params = new URLSearchParams({
                        game: this.currentGame,
                        limit: '5'
                    });
                    
                    if (query) {
                        params.append('query', query);
                    }

                    const response = await fetch(`${this.apiBase}/tips?${params}`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const data = await response.json();
                    this.tips = data.tips;
                    this.displayTips(data.tips);
                    this.updateConnectionStatus(true);

                } catch (error) {
                    console.error('Failed to load tips:', error);
                    this.updateConnectionStatus(false);
                    container.innerHTML = `
                        <div class="tip-card error fade-in">
                            <div class="tip-title">⚠️ Connection Error</div>
                            <div class="tip-content">Failed to load tips: ${error.message}</div>
                            <div class="action-buttons">
                                <button class="action-btn retry-pulse" onclick="pixlyHUD.refreshTips()">🔄 Retry</button>
                            </div>
                        </div>
                    `;
                }
            }

            displayTips(tips) {
                const container = document.getElementById('tipsContainer');
                
                if (!tips || tips.length === 0) {
                    container.innerHTML = `
                        <div class="tip-card fade-in">
                            <div class="tip-title">🔍 No Tips Found</div>
                            <div class="tip-content">Try a different search or game name.</div>
                            <div class="action-buttons">
                                <button class="action-btn" onclick="pixlyHUD.loadTips()">🔄 Refresh</button>
                            </div>
                        </div>
                    `;
                    return;
                }

                const tipsHtml = tips.map((tip, index) => {
                    const isFavorite = this.favorites.includes(tip.id);
                    return `
                        <div class="tip-card fade-in" style="animation-delay: ${index * 0.1}s">
                            <div class="tip-title">
                                ${this.escapeHtml(tip.title || 'Game Tip')}
                                <span style="margin-left: auto; cursor: pointer; font-size: 18px;" onclick="pixlyHUD.toggleFavorite('${tip.id}')">
                                    ${isFavorite ? '❤️' : '🤍'}
                                </span>
                            </div>
                            <div class="tip-content">${this.escapeHtml(tip.content)}</div>
                            <div class="tip-meta">
                                ${tip.category ? `<span>📂 ${tip.category}</span>` : ''}
                                ${tip.difficulty ? `<span>⚡ ${tip.difficulty}</span>` : ''}
                                ${tip.is_verified ? `<span>✅ Verified</span>` : ''}
                            </div>
                            <div class="action-buttons">
                                <button class="action-btn" onclick="pixlyHUD.copyTip('${tip.id}')">📋 Copy</button>
                                <button class="action-btn" onclick="pixlyHUD.shareTip('${tip.id}')">🔗 Share</button>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = tipsHtml;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            toggleMinimize() {
                this.isMinimized = !this.isMinimized;
                const overlay = document.getElementById('pixlyOverlay');
                const content = overlay.querySelector('.pixly-content');
                
                if (this.isMinimized) {
                    overlay.style.height = '80px';
                    content.style.display = 'none';
                } else {
                    overlay.style.height = 'auto';
                    content.style.display = 'block';
                }
            }

            close() {
                console.log('Closing Pixly HUD...');
                document.body.innerHTML = '<div style="color: white; text-align: center; padding: 20px; font-family: Orbitron, monospace;">Pixly HUD closed</div>';
            }

            startPeriodicUpdates() {
                setInterval(() => {
                    if (!this.isMinimized) {
                        this.loadTips();
                    }
                }, 30000);
            }

            async checkConnection() {
                try {
                    const response = await fetch(`${this.apiBase}/health`);
                    this.updateConnectionStatus(response.ok);
                } catch (error) {
                    this.updateConnectionStatus(false);
                }
            }

            updateConnectionStatus(connected) {
                this.isConnected = connected;
                const indicator = document.getElementById('statusIndicator');
                if (indicator) {
                    indicator.style.background = connected ? '#00ff00' : '#ff0000';
                    indicator.style.boxShadow = connected ? '0 0 10px #00ff00' : '0 0 10px #ff0000';
                }
            }

            setupDragAndDrop() {
                const overlay = document.getElementById('pixlyOverlay');
                let isDragging = false;
                let startX, startY, startLeft, startTop;

                overlay.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.pixly-header') || e.target.closest('.pixly-container')) {
                        isDragging = true;
                        startX = e.clientX;
                        startY = e.clientY;
                        startLeft = overlay.offsetLeft;
                        startTop = overlay.offsetTop;
                        overlay.style.cursor = 'grabbing';
                    }
                });

                document.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        const deltaX = e.clientX - startX;
                        const deltaY = e.clientY - startY;
                        overlay.style.left = (startLeft + deltaX) + 'px';
                        overlay.style.top = (startTop + deltaY) + 'px';
                        overlay.style.right = 'auto';
                    }
                });

                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        overlay.style.cursor = 'move';
                    }
                });
            }

            setupKeyboardShortcuts() {
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch (e.key) {
                            case 'r':
                                e.preventDefault();
                                this.refreshTips();
                                break;
                            case 'f':
                                e.preventDefault();
                                document.getElementById('searchInput').focus();
                                break;
                        }
                    }
                });
            }

            refreshTips() {
                this.loadTips(document.getElementById('searchInput').value);
            }

            toggleFavorite(tipId) {
                const index = this.favorites.indexOf(tipId);
                if (index > -1) {
                    this.favorites.splice(index, 1);
                } else {
                    this.favorites.push(tipId);
                }
                localStorage.setItem('favorites', JSON.stringify(this.favorites));
                this.displayTips(this.tips);
            }

            copyTip(tipId) {
                const tip = this.tips.find(t => t.id == tipId);
                if (tip) {
                    navigator.clipboard.writeText(`${tip.title}\n\n${tip.content}`);
                    this.showNotification('Tip copied to clipboard!');
                }
            }

            shareTip(tipId) {
                const tip = this.tips.find(t => t.id == tipId);
                if (tip && navigator.share) {
                    navigator.share({
                        title: tip.title,
                        text: tip.content,
                        url: window.location.href
                    });
                } else {
                    this.copyTip(tipId);
                    this.showNotification('Tip copied to clipboard!');
                }
            }

            handleTipClick(tipCard) {
                tipCard.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    tipCard.style.transform = '';
                }, 150);
            }

            showNotification(message) {
                const notification = document.createElement('div');
                notification.className = 'notification';
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.style.animation = 'notificationSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1) reverse';
                    setTimeout(() => {
                        notification.remove();
                    }, 400);
                }, 3000);
            }
        }

        // Initialize Pixly HUD when page loads
        let pixlyHUD;
        document.addEventListener('DOMContentLoaded', () => {
            pixlyHUD = new PixlyHUD();
        });
    </script>
</body>
</html>
